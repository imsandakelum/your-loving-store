<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Loving Store - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* --- Reset & Body --- */
        body {
            font-family: 'SF Pro Display', '-apple-system', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            position: relative;
        }

        /* --- 🎯 Background & Layers --- */
        #bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -4;
            background-size: cover;
            background-position: center;
            transition: background-image 1.5s ease-in-out; 
        }

        /* ඉර / හඳ Layer */
        #celestial-body {
            position: absolute;
            top: 10%; 
            right: 15%;
            width: 150px;
            z-index: -3;
            transition: transform 0.15s ease-out; /* SmoothNESS වැඩි කළා */
        }

        /* ෆ්ලයිට් Layer */
        #flight {
            position: absolute;
            top: 35%; 
            left: 5%;
            width: 500px;
            z-index: -2;
            transition: transform 0.15s ease-out; /* SmoothNESS වැඩි කළා */
        }

        /* --- 🎬 Idle Animations (තත්පර 5ක් හිටියොත්) --- */
        .idle-animate-flight {
            animation: flyFlight 5s ease-in-out infinite alternate !important;
        }

        .idle-animate-celestial {
            animation: floatCelestial 8s ease-in-out infinite alternate !important;
        }

        @keyframes flyFlight {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(2deg); } /* පාවෙන ප්‍රමාණයත් ලාවට අඩු කළා */
        }

        @keyframes floatCelestial {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-10px) scale(1.03); } 
        }

        /* --- 🎯 Glowing Light Border Wrapper --- */
        .glass-card-wrapper {
            position: relative;
            padding: 3px;
            border-radius: 22px;
            overflow: hidden;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .glass-card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, #00f0ff);
            animation: spinLight 4s linear infinite;
            z-index: -1;
        }

        @keyframes spinLight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Glass Card Styling --- */
        .glass-card {
            background: rgba(20, 20, 20, 0.85); 
            backdrop-filter: blur(15px);
            border-radius: 19px; 
            padding: 40px;
            color: #ffffff;
            text-align: center;
        }

        .brand-title { font-weight: 800; font-size: 28px; letter-spacing: -0.5px; margin-bottom: 5px; }
        .brand-sub { font-weight: 500; font-size: 14px; opacity: 0.8; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }
        .form-control-glass { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 12px; padding: 12px 15px; }
        .form-control-glass::placeholder { color: rgba(255, 255, 255, 0.6); }
        .form-control-glass:focus { background: rgba(255, 255, 255, 0.15); border-color: rgba(0, 240, 255, 0.5); color: #fff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
        .btn-glass { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); border: none; color: white; font-weight: 600; border-radius: 12px; padding: 12px; transition: all 0.3s ease; }
        .btn-glass:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4); }
        .alert-glass { background: rgba(255, 82, 82, 0.3); border: 1px solid rgba(255, 82, 82, 0.5); color: #ffffff; border-radius: 12px; backdrop-filter: blur(10px); }

        /* --- 🎯 Footer Credit --- */
        .footer-credit {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            z-index: 20;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .footer-credit a {
            color: #00f0ff;
            text-decoration: none;
            font-weight: 800;
            transition: all 0.3s ease;
        }

        .footer-credit a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px #00f0ff;
        }
    </style>
</head>
<body>

    <div id="bg-container"></div>
    <img id="celestial-body" src="" alt="Celestial Body">
    <img id="flight" src="" alt="SriLankan Flight">

    <div class="glass-card-wrapper">
        <div class="glass-card">
            <h3 class="brand-title">Your Loving Store</h3>
            <p class="brand-sub">System Login</p>
            
            {% if error %}
            <div class="alert alert-glass p-2 small text-center fw-bold" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label" style="text-align: left; display: block; font-size: 0.9rem;">Username</label>
                    <input type="text" class="form-control form-control-glass" id="username" name="username" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label" style="text-align: left; display: block; font-size: 0.9rem;">Password</label>
                    <input type="password" class="form-control form-control-glass" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-glass w-100">Sign In</button>
            </form>
        </div>
    </div>

    <div class="footer-credit">
        Designed by <a href="https://www.instagram.com/im_sandakelum" target="_blank">Indika</a>
    </div>

    <script>
        const hour = new Date().getHours();
        const bgContainer = document.getElementById('bg-container');
        const celestial = document.getElementById('celestial-body');
        const flight = document.getElementById('flight');

        // 1. Time Based Logic
        if (hour >= 6 && hour < 12) {
            bgContainer.style.backgroundImage = "url('{{ url_for('static', filename='images/morning_bg.jpg') }}')";
            celestial.src = "{{ url_for('static', filename='images/sun.png') }}";
            celestial.style.display = "block";
            flight.src = "{{ url_for('static', filename='images/flight.png') }}";
        } else if (hour >= 12 && hour < 18) {
            bgContainer.style.backgroundImage = "url('{{ url_for('static', filename='images/day_bg.jpg') }}')";
            celestial.style.display = "none";
            flight.src = "{{ url_for('static', filename='images/flight.png') }}";
        } else {
            bgContainer.style.backgroundImage = "url('{{ url_for('static', filename='images/night_bg.jpg') }}')";
            celestial.src = "{{ url_for('static', filename='images/moon.png') }}";
            celestial.style.display = "block";
            flight.src = "{{ url_for('static', filename='images/night_flight.png') }}";
        }

        // 2. Mouse Move & Idle Animation Logic
        let idleTimer;

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            
            flight.classList.remove('idle-animate-flight');
            celestial.classList.remove('idle-animate-celestial');

            idleTimer = setTimeout(() => {
                flight.style.transform = ''; 
                celestial.style.transform = '';
                flight.classList.add('idle-animate-flight');
                celestial.classList.add('idle-animate-celestial');
            }, 5000);
        }

        document.addEventListener('mousemove', (e) => {
            // 🎯 Movement Sensitivity එක ගොඩක් අඩු කළා (/ 90 යොදා ඇත)
            const xAxis = (window.innerWidth / 2 - e.pageX) / 90;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 90;

            if(!flight.classList.contains('idle-animate-flight')) {
                // ෆ්ලයිට් එකේ හැරෙන ප්‍රමාණයත් අඩු කළා (xAxis/25)
                flight.style.transform = `translate(${xAxis}px, ${yAxis}px) rotate(${xAxis/25}deg)`;
            }
            if(!celestial.classList.contains('idle-animate-celestial') && celestial.style.display !== 'none') {
                // ඉර/හඳ ඊටත් වඩා හෙමින් යන්න හැදුවා
                celestial.style.transform = `translate(${xAxis/2}px, ${yAxis/2}px)`;
            }
            
            resetIdleTimer();
        });

        resetIdleTimer();
    </script>
</body>
</html>
