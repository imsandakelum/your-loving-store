{% extends 'base.html' %}

{% block content %}
<style>
    /* Creative Sticky Notes CSS */
    .notes-board { background-color: #f8f9fa; padding: 20px; border-radius: 15px; min-height: 500px; background-image: radial-gradient(#d1d8e0 1px, transparent 1px); background-size: 20px 20px; }
    .sticky-note { padding: 20px; border-radius: 5px; box-shadow: 3px 5px 15px rgba(0,0,0,0.1); transition: transform 0.3s ease, box-shadow 0.3s ease; position: relative; margin-bottom: 20px; }
    .sticky-note:hover { transform: scale(1.03) rotate(-1deg); box-shadow: 5px 8px 20px rgba(0,0,0,0.15); z-index: 10; }
    .note-date { font-size: 11px; opacity: 0.7; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px; }
    .note-content { font-size: 15px; white-space: pre-wrap; color: #2c3e50; line-height: 1.5; }
    .note-actions { position: absolute; bottom: 10px; right: 10px; opacity: 0; transition: opacity 0.3s; }
    .sticky-note:hover .note-actions { opacity: 1; }
    
    /* වර්ණ තෝරන්නා (Color Picker) */
    .color-option { width: 30px; height: 30px; border-radius: 50%; display: inline-block; cursor: pointer; margin-right: 10px; border: 2px solid transparent; }
    .color-option input { display: none; }
    .color-option input:checked + label { border: 2px solid #2c3e50; box-shadow: 0 0 5px rgba(0,0,0,0.3); }
</style>

<h3 class="mb-4" style="color: #2c3e50; font-weight: bold;">📝 My Notes😇</h3>

<div class="card p-4 mb-4 shadow-sm" style="border-radius: 15px;">
    <form action="/notes" method="POST">
        <input type="hidden" name="action" value="add">
        <div class="row">
            <div class="col-md-2">
                <label class="form-label fw-bold">Date</label>
                <input type="date" class="form-control" name="note_date" value="{{ today_date }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">What's on your mind?</label>
                <textarea class="form-control" name="content" rows="2" placeholder="වැදගත් කරුණ මෙතන ලියන්න..." required></textarea>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold d-block">Pick a Color (වැදගත්කම)</label>
                <div class="d-flex align-items-center mt-2">
                    <div class="color-option" style="background-color: #f1c40f;">
                        <input type="radio" name="color" value="#f1c40f" id="c1" checked> <label for="c1" class="w-100 h-100 rounded-circle"></label>
                    </div>
                    <div class="color-option" style="background-color: #ff9ff3;">
                        <input type="radio" name="color" value="#ff9ff3" id="c2"> <label for="c2" class="w-100 h-100 rounded-circle"></label>
                    </div>
                    <div class="color-option" style="background-color: #54a0ff;">
                        <input type="radio" name="color" value="#54a0ff" id="c3"> <label for="c3" class="w-100 h-100 rounded-circle"></label>
                    </div>
                    <div class="color-option" style="background-color: #1dd1a1;">
                        <input type="radio" name="color" value="#1dd1a1" id="c4"> <label for="c4" class="w-100 h-100 rounded-circle"></label>
                    </div>
                    <button type="submit" class="btn btn-dark fw-bold ms-auto px-4 rounded-pill">📌 Pin Note</button>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="notes-board row">
    {% for note in notes %}
    <div class="col-md-3">
        <div class="sticky-note" style="background-color: {{ note[2] }};">
            <div class="note-date">🕒 {{ note[3] }}</div>
            <div class="note-content">{{ note[1] }}</div>
            
            <div class="note-actions">
                <button type="button" class="btn btn-sm btn-light p-1 px-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#editModal{{ note[0] }}">✏️</button>
                <a href="/delete_note/{{ note[0] }}" class="btn btn-sm btn-danger p-1 px-2 shadow-sm" onclick="return confirm('මේ සටහන මකන්නද?');">🗑️</a>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal{{ note[0] }}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form action="/notes" method="POST">
                    <input type="hidden" name="action" value="edit">
                    <input type="hidden" name="note_id" value="{{ note[0] }}">
                    <div class="modal-header" style="background-color: {{ note[2] }}; border: none;">
                        <h5 class="modal-title fw-bold">Edit Note</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <label class="form-label fw-bold">Date</label>
                        <input type="date" class="form-control mb-3" name="note_date" value="{{ note[3] }}" required>
                        <label class="form-label fw-bold">Content</label>
                        <textarea class="form-control" name="content" rows="4" required>{{ note[1] }}</textarea>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-dark w-100 fw-bold">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
